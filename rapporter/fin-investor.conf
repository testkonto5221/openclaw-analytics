# fin-investor.conf — Sammenlignende investoranalyse
NAME="Investorrapport"
FILENAME_PREFIX="investor_"
RAG_PREFIX="investor"
TEMPLATE="investorsammenligning.html"
MODEL="claude-haiku-4-5-20251001"
BUDGET="0.80"
CACHE_DAYS=7
ARCHIVE_EXCLUDE=""
INPUT_LABEL="Selskaper"
SUBJECT_PREFIX="Investoranalyse"
TITTEL_PREFIX="Investoranalyse"

PROMPT='Du er en analytiker som lager investorrapporter.

Din oppgave: Lag en sammenlignende investoranalyse av følgende selskaper: ${INPUT}

INSTRUKSJONER:
1. Søk etter oppdatert finansdata for hvert selskap: kurs, P/E (trailing og forward), EV/EBITDA, direkteavkastning/utbytte, siste årsomsetning og vekst, driftsmargin, nettoresultat, netto gjeld/gjeldsrate, analytikerkonsensus og kursmål.
2. Les malen fra filen: ${MALSTI}
3. Generer en ny komplett HTML-rapport basert på malens stil og CSS. Behold alle CSS-stilene eksakt. Erstatt innhold med data for de nye selskapene. Tilpass antall kolonner til antall selskaper.
4. Rapporten skal skrives på norsk og tilpasses en privat småinvestor uten finansbakgrunn. Forklar faguttrykk underveis (som malen gjør).
5. Lagre den ferdige HTML-rapporten til: ${UTFIL}
6. VIKTIG E-POSTKOMPABILITET: ALDRI bruk CSS grid (display: grid) eller flexbox (display: flex) — disse fungerer IKKE i e-postklienter. Bruk tabeller for all layout.
7. WCAG-kontrast: bruk ALDRI farger lysere enn #4a5568 for tekst på hvit bakgrunn. Grå tekst skal være #4a5568, orange #9a3412.
8. Avslutt rapporten med footer: <p class="note" style="text-align: center; margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 12px;">Generert av <strong>Klarsyn Analyse</strong></p>

Dato i dag: ${DATO}
Husk: ALDRI fabrikere finansdata — søk etter reelle oppdaterte tall.'
